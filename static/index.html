<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGX Trading Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.umd.min.js"></script>
</head>
<body>

<header>
  <h1>SGX Trading Dashboard</h1>
  <span id="market-status">&#9675; SGX CLOSED</span>
  <div id="unlock-section">
    <input type="password" id="trade-password" placeholder="Trade password"
           onkeydown="if(event.key==='Enter') unlockTrade()">
    <button onclick="unlockTrade()">Unlock Trading</button>
    <span id="unlock-status"></span>
  </div>
</header>

<div id="main-layout">

  <aside id="watchlist-panel">
    <h2>Watchlist</h2>
    <div id="watchlist-add">
      <input id="symbol-input" placeholder="SG.D05" style="flex:1">
      <button onclick="addToWatchlist()">+</button>
    </div>
    <div id="watchlist-items"></div>
  </aside>

  <section id="chart-section">
    <div id="chart-controls">
      <span id="selected-symbol">-</span>
      <button class="ktype-btn active" data-kt="1min"  onclick="setKtype('1min')">1m</button>
      <button class="ktype-btn"        data-kt="5min"  onclick="setKtype('5min')">5m</button>
      <button class="ktype-btn"        data-kt="15min" onclick="setKtype('15min')">15m</button>
    </div>
    <canvas id="price-chart"></canvas>
    <div id="bid-ask-panel"></div>
  </section>

  <aside id="right-panel">
    <div class="panel-section">
      <h2>Place Order &mdash; <span id="order-code-display" style="color:#c9d1d9">select symbol</span></h2>
      <select id="order-side">
        <option value="BUY">BUY</option>
        <option value="SELL">SELL</option>
      </select>
      <select id="order-type">
        <option value="LIMIT">LIMIT</option>
        <option value="MARKET">MARKET</option>
      </select>
      <input id="order-qty"   type="number" placeholder="Quantity (lots)" min="1">
      <input id="order-price" type="number" placeholder="Price (SGD)" step="0.001" min="0">
      <div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn-buy" style="flex:1" onclick="placeOrder()">Submit Order</button>
        <button onclick="Orders.refresh()" style="background:#21262d;color:#8b949e;flex:0">&orarr;</button>
      </div>
    </div>

    <div class="panel-section">
      <h2>Open Orders</h2>
      <div id="orders-list"><p class="empty">Loading...</p></div>
    </div>

    <div class="panel-section">
      <h2>Account</h2>
      <div id="account-info"><p class="empty">Loading...</p></div>
      <h3>Positions</h3>
      <div id="positions-list"><p class="empty">Loading...</p></div>
    </div>
  </aside>
</div>

<footer id="alerts-panel">
  <div id="alerts-inner">
    <div id="alerts-add">
      <h2>Alerts</h2>
      <input id="alert-code"      placeholder="SG.D05" style="width:80px">
      <select id="alert-dir" style="width:100px">
        <option value="above">Price Above</option>
        <option value="below">Price Below</option>
      </select>
      <input id="alert-threshold" type="number" step="0.001" placeholder="Threshold" style="width:90px">
      <input id="alert-label"     placeholder="Label (opt)" style="width:90px">
      <button onclick="AlertMgr.addAlert()">Set Alert</button>
    </div>
    <div id="alerts-list"></div>
    <div id="active-alerts"></div>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/watchlist.js"></script>
<script src="/js/orderbook.js"></script>
<script src="/js/order_panel.js"></script>
<script src="/js/account.js"></script>
<script src="/js/alerts.js"></script>

</body>
</html>
